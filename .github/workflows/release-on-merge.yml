name: Release on merged pull request

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update package version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/bump-version.mjs

      - name: Commit version bump
        id: commit
        if: steps.version.outputs.skip_commit != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${RELEASE_TAG}" -m "Release-PR: #${PR_NUMBER}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha || steps.version.outputs.commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          git fetch origin --tags
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git tag "${RELEASE_TAG}" "${COMMIT_SHA}"
            git push origin "${RELEASE_TAG}"
          fi
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf '%s\n\nMerged from %s\n' "${PR_TITLE}" "${PR_URL}" > "$RUNNER_TEMP/release-notes.md"
            gh release create "${RELEASE_TAG}" \
              --target "${COMMIT_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
